services:
  app-sqlite:
    build: .
    environment:
      DB_BACKEND: sqlite
      URL_SHORTENER_DATA_DIR: /data
    volumes:
      - sqlite_data:/data
    ports:
      - "8080:8080"
    profiles: ["sqlite"]

  app-postgres:
    build: .
    depends_on:
      - postgres
    environment:
      DB_BACKEND: postgres
      POSTGRES_DSN: postgresql://urlshortener:urlshortener@postgres:5432/urlshortener
    ports:
      - "8080:8080"
    profiles: ["postgres"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    volumes:
      - pg_data:/var/lib/postgresql/data
    profiles: ["postgres"]

  app-mysql:
    build: .
    depends_on:
      - mysql
    environment:
      DB_BACKEND: mysql
      MYSQL_DSN: mysql://urlshortener:urlshortener@mysql:3306/urlshortener
    ports:
      - "8080:8080"
    profiles: ["mysql"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: urlshortener
      MYSQL_USER: urlshortener
      MYSQL_PASSWORD: urlshortener
      MYSQL_ROOT_PASSWORD: root
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql
    profiles: ["mysql"]

volumes:
  sqlite_data:
  pg_data:
  mysql_data:
